name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # O upload de pastas pela interface do GitHub adiciona/substitui arquivos,
      # mas não remove os que deixaram de existir na versão nova.
      - name: Remover integração web antiga
        run: |
          rm -f app/src/main/java/app/motorzoom/OfflineNtscServer.kt
          rm -f app/src/main/java/app/motorzoom/NtscServerService.kt

      - name: Configurar Rust para Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Compilar núcleo NTSC-RS nativo
        run: |
          mkdir -p app/src/main/jniLibs
          cargo ndk -t arm64-v8a -p 26 -o app/src/main/jniLibs build \
            --manifest-path native/ntsc-android/Cargo.toml --release

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorZoom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
