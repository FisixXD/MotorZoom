name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # O upload de pastas pela interface do GitHub adiciona/substitui arquivos,
      # mas não remove os que deixaram de existir na versão nova.
      - name: Remover integração web antiga
        run: |
          rm -f app/src/main/java/app/motorzoom/OfflineNtscServer.kt
          rm -f app/src/main/java/app/motorzoom/NtscServerService.kt

      - name: Configurar Rust para Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Compilar núcleo NTSC-RS nativo
        working-directory: native/ntsc-android
        run: |
          mkdir -p ../../app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 26 -o ../../app/src/main/jniLibs build --release

      - name: Compilar exportador FFmpeg 480i
        run: |
          curl -L --fail --retry 3 https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg-src /tmp/ffmpeg-out app/src/main/jniLibs/arm64-v8a
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-src --strip-components=1
          cd /tmp/ffmpeg-src
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          TARGET="aarch64-linux-android"
          ./configure \
            --prefix=/tmp/ffmpeg-out \
            --target-os=android --arch=aarch64 --cpu=armv8-a \
            --enable-cross-compile \
            --cc="$TOOLCHAIN/bin/${TARGET}26-clang" \
            --cxx="$TOOLCHAIN/bin/${TARGET}26-clang++" \
            --ar="$TOOLCHAIN/bin/llvm-ar" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --strip="$TOOLCHAIN/bin/llvm-strip" \
            --nm="$TOOLCHAIN/bin/llvm-nm" \
            --enable-pic --enable-small --disable-shared --enable-static \
            --disable-doc --disable-debug --disable-network --disable-autodetect \
            --disable-programs --enable-ffmpeg \
            --disable-everything \
            --enable-avcodec --enable-avformat --enable-avfilter --enable-swscale --enable-swresample \
            --enable-protocol=file,pipe \
            --enable-demuxer=mov,rawvideo \
            --enable-parser=aac \
            --enable-decoder=aac,rawvideo \
            --enable-encoder=mpeg2video,mp2 \
            --enable-muxer=mpeg \
            --enable-filter=scale,format \
            --extra-ldflags="-Wl,-z,max-page-size=16384"
          make -j2 ffmpeg
          cp ffmpeg "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libffmpeg.so"

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorZoom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
