name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Empacotar editor NTSC-RS oficial para uso offline
        run: |
          python3 scripts/fetch_ntsc_web.py
          mkdir -p app/src/main/assets/ntsc-web/licenses
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ntsc-rs/ntsc-rs/main/LICENSE-APACHE-2.0 \
            --output app/src/main/assets/ntsc-web/licenses/LICENSE-APACHE-2.0
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ntsc-rs/ntsc-rs/main/LICENSE-ISC \
            --output app/src/main/assets/ntsc-web/licenses/LICENSE-ISC
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ntsc-rs/ntsc-rs/main/LICENSE-MIT \
            --output app/src/main/assets/ntsc-web/licenses/LICENSE-MIT

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorZoom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
